<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Conflict Globe</title>
  <link rel="icon" href="data:,">

  <style>
    /* Panel widths scale with the window so the globe keeps a usable middle
       on a 13-inch screen and does not look lost on a 27-inch one. clamp
       gives a floor, a proportion, and a ceiling in one value. */
    :root {
      --left-w: clamp(300px, 25vw, 400px);
      --right-w: clamp(300px, 24vw, 380px);
      --rail-w: 34px;
    }

    body {
      margin: 0;
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    }

    /* ---- The side panel ------------------------------------------
       It is always on the page. We just slide it off-screen to the
       left until a marker is clicked. That is what translateX does.
    ---------------------------------------------------------------- */
    /* The globe does not sit under the panels, it sits BETWEEN them. The
       inset moves with whichever panels are open and the canvas is resized
       to match, so the globe stays centred in whatever space is left rather
       than half-hidden behind a panel. */
    #globeViz {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      transition: left 0.35s ease, right 0.35s ease;
    }

    body.left-open #globeViz { left: var(--left-w); }
    body.right-open #globeViz { right: var(--right-w); }
    body.right-open.right-min #globeViz { right: var(--rail-w); }

    #panel {
      position: fixed;
      top: 0;
      left: 0;
      width: var(--left-w);
      height: 100%;
      box-sizing: border-box;
      padding: 40px 32px;
      background: rgba(10, 12, 16, 0.92);
      backdrop-filter: blur(12px);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      color: #e8eaed;
      transform: translateX(-100%);
      transition: transform 0.35s ease;
      overflow-y: auto;
    }

    /* When the panel also has the class "open", slide it into view. */
    #panel.open {
      transform: translateX(0);
    }

    #panel-close {
      position: absolute;
      top: 20px;
      right: 24px;
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.4);
      font-size: 26px;
      line-height: 1;
      cursor: pointer;
      padding: 4px;
    } 

    #panel-close:hover {
      color: #fff;
    }

    #panel-back {
      display: none;
      background: none;
      border: none;
      padding: 0 0 14px;
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.4);
      cursor: pointer;
    }

    #panel-back:hover { color: #ff8177; }
    #panel-back.visible { display: block; }

    .loc-heading {
      margin: 28px 0 6px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: rgba(255, 255, 255, 0.45);
    }

    .loc-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 10px 0;
      background: none;
      border: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      font: inherit;
      font-size: 14px;
      color: rgba(232, 234, 237, 0.85);
      text-align: left;
      cursor: pointer;
    }

    .loc-item:hover { color: #ff8177; }

    .loc-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff2a1f;
      flex: 0 0 auto;
      margin-left: 12px;
    }

    /* ---- Auto-detected locations ---------------------------------
       A second, clearly subordinate layer. Amber not red, smaller,
       italic, hollow dot. Nothing here is verified. -------------- */
    .loc-heading-auto {
      color: rgba(255, 176, 32, 0.75);
    }

    .loc-item-auto {
      color: rgba(232, 234, 237, 0.55);
      font-style: italic;
    }

    .loc-item-auto:hover { color: #ffc357; }

    .loc-dot-auto {
      background: none;
      border: 1px solid #a855f7;
    }

    .loc-count {
      margin-left: auto;
      margin-right: 10px;
      font-size: 11px;
      font-style: normal;
      color: rgba(255, 255, 255, 0.3);
    }

    #panel-summary .auto-note {
      color: rgba(168, 85, 247, 0.85);
      font-weight: 600;
    }

    #panel-summary .auto-stats {
      display: block;
      margin-top: 14px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.4);
    }

    /* ---- Telegram-reported locations: a third layer, blue --------- */
    .loc-heading-tg { color: rgba(168, 85, 247, 0.85); }
    .loc-item-tg:hover { color: #c99cff; }
    .loc-dot-tg { background: none; border: 1px solid #a855f7; }

    .tg-evidence {
      display: block;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      text-decoration: none;
    }
    .tg-ev-meta {
      display: block;
      font-size: 11px;
      letter-spacing: 0.04em;
      color: rgba(255, 255, 255, 0.42);
    }
    .tg-ev-text {
      display: block;
      margin-top: 4px;
      font-size: 13px;
      line-height: 1.45;
      color: rgba(232, 234, 237, 0.75);
    }
    .tg-evidence:hover .tg-ev-text { color: rgba(255, 255, 255, 0.95); }

    #panel-title {
      margin: 0 0 10px;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    #panel-meta {
      margin: 0 0 24px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #ff5a4d;
    }

    #panel-summary {
      margin: 0;
      font-size: 15px;
      line-height: 1.65;
      color: rgba(232, 234, 237, 0.78);
    }

    /* ---- Key events: the curated history layer --------------------- */
    .ke-item {
      display: flex;
      gap: 12px;
      padding: 9px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .ke-date {
      flex: none;
      width: 74px;
      text-align: right;
      padding-top: 1px;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      color: rgba(255, 90, 77, 0.85);
    }

    .ke-text {
      flex: 1;
      min-width: 0;
      font-size: 13.5px;
      line-height: 1.5;
      color: rgba(232, 234, 237, 0.85);
    }

    .ke-src {
      display: inline-block;
      margin-top: 5px;
      font-size: 10.5px;
      letter-spacing: 0.03em;
      text-decoration: none;
      color: rgba(255, 255, 255, 0.34);
      border-bottom: 1px solid rgba(255, 255, 255, 0.16);
    }

    .ke-src:hover { color: #ff8177; border-bottom-color: rgba(255, 90, 77, 0.5); }

    .ke-note {
      display: block;
      margin-top: 4px;
      font-size: 11px;
      line-height: 1.4;
      color: rgba(255, 255, 255, 0.32);
    }

    /* ---- Recent events, from the Telegram layer -------------------- */
    /* The caveat lives in the heading rather than in a sentence of its
       own: still present on every location, but not shouting. */
    .ev-unver {
      margin-left: 6px;
      font-weight: 400;
      letter-spacing: 0.08em;
      color: rgba(168, 85, 247, 0.9);
    }

    .ev-day { margin-bottom: 22px; }

    .ev-day-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(168, 85, 247, 0.35);
    }

    .ev-date {
      font-size: 13px;
      font-weight: 600;
      color: rgba(232, 234, 237, 0.9);
    }

    .ev-count {
      font-size: 11px;
      white-space: nowrap;
      color: rgba(255, 255, 255, 0.35);
    }

    .ev-item {
      display: flex;
      gap: 12px;
      padding: 11px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      text-decoration: none;
      color: inherit;
    }

    .ev-time {
      flex: none;
      width: 38px;
      padding-top: 1px;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      color: rgba(255, 255, 255, 0.35);
    }

    .ev-body { flex: 1; min-width: 0; }

    .ev-line {
      display: block;
      font-size: 14px;
      line-height: 1.45;
      color: rgba(232, 234, 237, 0.92);
    }

    /* Unparsed reports are shown in the source's own words. Italic marks
       them as a quotation rather than a summary we produced. */
    .ev-line-plain {
      font-style: italic;
      color: rgba(232, 234, 237, 0.75);
    }

    .ev-said {
      display: block;
      margin-top: 3px;
      font-size: 12px;
      line-height: 1.45;
      color: rgba(255, 255, 255, 0.4);
    }

    /* A 'reported' event is one source's words. Naming the channel inline
       keeps the grammar honest: the channel is speaking, not the site. */
    .ev-speaker {
      font-style: normal;
      letter-spacing: 0.03em;
      color: rgba(255, 255, 255, 0.5);
    }

    .ev-chan {
      display: block;
      margin-top: 5px;
      font-size: 11px;
      letter-spacing: 0.04em;
      color: rgba(255, 255, 255, 0.4);
    }

    /* Rung on the confidence ladder. */
    .ev-status {
      display: inline-block;
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      padding: 1px 5px;
      border-radius: 3px;
    }
    .ev-status-reported     { color: rgba(168, 85, 247, 0.95); border: 1px solid rgba(168, 85, 247, 0.45); }
    .ev-status-corroborated { color: rgba(94, 201, 150, 0.95); border: 1px solid rgba(94, 201, 150, 0.45); }
    .ev-status-confirmed    { color: rgba(255, 120, 110, 0.95); border: 1px solid rgba(255, 120, 110, 0.45); }

    .ev-said-link { text-decoration: none; color: inherit; display: block; }
    .ev-item:hover .ev-line { color: #c99cff; }

    /* The corroborating source, set apart from the report it corroborates.
       Green because it is the one thing on this panel that another party
       had to concede. */
    .ev-why {
      display: block;
      margin-top: 7px;
      padding-left: 9px;
      border-left: 2px solid rgba(94, 201, 150, 0.5);
    }

    .ev-why-reason {
      display: block;
      font-size: 11.5px;
      line-height: 1.4;
      color: rgba(94, 201, 150, 0.95);
    }

    .ev-why-link { text-decoration: none; }

    .ev-why-src {
      display: block;
      margin-top: 3px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
    }

    .ev-why-side {
      font-size: 10px;
      letter-spacing: 0.05em;
      color: rgba(255, 255, 255, 0.3);
    }

    .ev-why-title {
      display: block;
      font-size: 11.5px;
      line-height: 1.4;
      color: rgba(232, 234, 237, 0.62);
    }

    .ev-why-link:hover .ev-why-title { color: #cfe4ff; }

    .ev-chans {
      margin-top: 9px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.28);
    }

    /* ---- The recent coverage list ---------------------------------- */
    .news-heading {
      margin: 32px 0 14px;
      padding-top: 22px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: rgba(255, 255, 255, 0.45);
    }

    .news-status {
      margin: 32px 0 0;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.35);
    }

    .news-item {
      display: block;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      text-decoration: none;
      color: inherit;
    }

    .news-item:hover .news-title {
      color: #ff8177;
    }

    .news-title {
      display: block;
      font-size: 14px;
      line-height: 1.45;
      color: rgba(232, 234, 237, 0.9);
    }

    .news-source {
      display: block;
      margin-top: 5px;
      font-size: 11px;
      letter-spacing: 0.04em;
      color: rgba(255, 255, 255, 0.35);
    }

    /* The headline as originally published, shown under the translation. */
    .news-original {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      line-height: 1.4;
      font-style: italic;
      color: rgba(255, 255, 255, 0.3);
    }

    /* ---- Sources for the written summary --------------------------- */
    .source-item {
      display: block;
      padding: 7px 0;
      font-size: 13px;
      line-height: 1.4;
      color: rgba(232, 234, 237, 0.62);
      text-decoration: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .source-item:hover {
      color: #ff8177;
    }

    /* ---- The reporting panel -------------------------------------- */
    #news-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: var(--right-w);
      height: 100%;
      box-sizing: border-box;
      background: rgba(10, 12, 16, 0.92);
      backdrop-filter: blur(12px);
      border-left: 1px solid rgba(255, 255, 255, 0.08);
      color: #e8eaed;
      transform: translateX(100%);
      transition: transform 0.35s ease, width 0.35s ease;
      overflow: hidden;
    }

    #news-panel.open { transform: translateX(0); }
    #news-panel.min  { width: var(--rail-w); }

    #news-inner {
      height: 100%;
      box-sizing: border-box;
      padding: 40px 28px;
      overflow-y: auto;
    }

    #news-panel.min #news-inner { display: none; }

    #news-min {
      position: absolute;
      top: 18px;
      left: 6px;
      z-index: 2;
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.4);
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      padding: 4px 8px;
    }

    #news-min:hover { color: #fff; }

    /* Collapsed, the panel keeps a rail wide enough to say what it is.
       A bare stripe with an arrow on it tells the reader nothing. */
    #news-rail {
      display: none;
      position: absolute;
      top: 64px;
      left: 0;
      width: var(--rail-w);
      text-align: center;
      writing-mode: vertical-rl;
      font-size: 10px;
      letter-spacing: 0.18em;
      color: rgba(255, 255, 255, 0.35);
      pointer-events: none;
    }

    #news-panel.min #news-rail { display: block; }
    #news-panel.min #news-min { transform: rotate(180deg); left: 2px; }

    #news-head {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.45);
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    #news-head strong {
      display: block;
      font-size: 17px;
      letter-spacing: 0;
      text-transform: none;
      color: #e8eaed;
      margin-bottom: 4px;
    }

    /* Which place a report is about, when the panel is showing a whole
       conflict rather than one marker. */
    /* The one line that matters, in plain type. No quote marks: the source
       line underneath says who is speaking, so the punctuation does not
       have to. */
    .ev-report {
      display: block;
      font-size: 13.5px;
      line-height: 1.5;
      color: #e8eaed;
    }

    /* Weapon, target, casualties as scannable chips. Only what the parser
       actually found; nothing is inferred to fill the row out. */
    .ev-facts {
      display: block;
      margin-top: 5px;
      font-size: 11.5px;
      color: rgba(255, 255, 255, 0.55);
    }

    .ev-fact {
      display: inline-block;
      margin-right: 10px;
      padding: 1px 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.06);
    }

    .ev-fact-cas { color: #ff9a92; background: rgba(255, 60, 48, 0.1); }

    /* Small, quiet, and the only clickable thing in the row. */
    .ev-src {
      display: inline-block;
      margin-top: 6px;
      font-size: 10.5px;
      letter-spacing: 0.04em;
      color: rgba(255, 255, 255, 0.38);
      text-decoration: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    .ev-src:hover { color: #c99cff; border-bottom-color: rgba(201, 156, 255, 0.5); }

    .ev-place {
      color: #ff8177;
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-right: 6px;
    }

    /* Below this width there is no middle left to protect: the panels stop
       squeezing the globe and simply cover it, one at a time. */
    @media (max-width: 900px) {
      :root { --left-w: min(92vw, 400px); --right-w: min(92vw, 400px); }
      body.left-open #globeViz,
      body.right-open #globeViz { left: 0; right: 0; }
    }
  </style>
</head>

<body>

  <!-- The globe gets drawn inside this box. -->
  <div id="globeViz"></div>

  <!-- The side panel. Empty to start with. JavaScript fills it in. -->
  <div id="panel">
    <button id="panel-close">&times;</button>
    <button id="panel-back">&larr; All conflicts</button>
    <h1 id="panel-title"></h1>
    <p id="panel-meta"></p>
    <p id="panel-summary"></p>
    <div id="panel-key-events"></div>
    <div id="panel-sources"></div>
    <div id="panel-locations"></div>
  </div>

  <!-- The reporting panel. Everything on this side is what is being SAID
       right now: unverified reports and press coverage. The left panel is
       what the site is prepared to stand behind. Keeping the two on
       opposite sides of the globe is the whole point - a reader should
       never have to work out which kind of claim they are reading. -->
  <aside id="news-panel">
    <button id="news-min" title="Hide reporting">&rsaquo;</button>
    <div id="news-rail">REPORTING</div>
    <div id="news-inner">
      <div id="news-head"></div>
      <div id="panel-events"></div>
      <div id="panel-news"></div>
    </div>
  </aside>

  <!-- Downloads the globe.gl library and gives us the Globe() function. -->
  <script src="https://cdn.jsdelivr.net/npm/globe.gl@2.46.2/dist/globe.gl.min.js"></script>

  <!-- Decodes TopoJSON, the compact format the country border data ships in. -->
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>

  <script>
    // ---------------------------------------------------------------
    // PART 1: build the globe itself.
    // ---------------------------------------------------------------
    const globe = Globe()(document.getElementById('globeViz'))
      .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-dark.jpg')
      .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
      .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
      .atmosphereColor('#3a7bd5')
      .atmosphereAltitude(0.18);

    // Exposed so the globe can be inspected from the console. It is the only
    // way to see what the ring layer is actually holding when its behaviour
    // does not match what the code says it should be.
    window.globe = globe;

    // ---------------------------------------------------------------
    // PART 2: camera and motion.
    // ---------------------------------------------------------------
    globe.controls().autoRotate = true;
    globe.controls().autoRotateSpeed = 0.4;
    globe.pointOfView({ lat: 25, lng: 20, altitude: 2.5 });

    // How far the camera currently is from the surface. Marker sizes are
    // scaled by this so they keep a constant size on screen as you zoom.
    let cameraAltitude = 2.5;

    // Clamped so markers neither vanish up close nor swell when far out.
    function zoomScale() {
      return Math.max(0.03, Math.min(cameraAltitude, 3));
    }

    // Auto-detected markers are deliberately smaller than any curated one
    // and do not pulse. They read as a hint, not a fact.
    const markerRadius = d => (0.33 + d.intensity * 0.12) * zoomScale();
    // Rings are pronounced in two situations and subtle in the third:
    //
    //   world view, conflict markers      pronounced — five markers, far apart,
    //                                     nothing to crowd
    //   inside a conflict, one selected   pronounced — it is the only ring on
    //                                     the globe, and the reach is what
    //                                     makes it read as "this one"
    //   inside a conflict, none selected  SUBTLE — a dozen city markers close
    //                                     together, and big rings overlap into
    //                                     a mess
    //
    // In any one of those states every visible ring shares a style, so this is
    // one setting per state rather than a value per ring. That also avoids
    // assuming globe.gl takes function accessors for propagation speed and
    // repeat period, which is the sort of assumption that has silently wiped
    // every marker on this globe before.
    // Three profiles, not two. The world view and a selected city both want
    // emphasis but they are not the same problem: one selected city has an
    // empty globe to expand into, five conflict markers do not. Treating them
    // alike made the world view sprawl.
    const RING_STYLE = {
      // One city, alone on the globe. Nothing to crowd, so it can travel.
      selected: { reach: 2.1, speed: 0.85, period: 700,  ease: 0.5 },
      // Five conflict markers. Enough presence to read as alive, tight enough
      // that they do not run into each other.
      world:    { reach: 1.4, speed: 1.1,  period: 1100, ease: 0.7 },
      // A dozen city markers close together. The original settings.
      subtle:   { reach: 1,   speed: 1.2,  period: 1400, ease: 1   },
    };

    function ringStyle() {
      if (activeLocation) return RING_STYLE.selected;
      if (!activeConflict) return RING_STYLE.world;
      return RING_STYLE.subtle;
    }

    const ringRadius = d =>
      (1.1 + d.intensity * 1.4) * ringStyle().reach * zoomScale();

    // ---------------------------------------------------------------
    // PART 2b: country borders.
    //
    // These are drawn as vector geometry, not painted into the globe
    // texture. Vectors have no resolution, so the borders stay sharp
    // however far you zoom, which a 4096px image never can.
    //
    // The file is TopoJSON, a compact format that stores shared borders
    // once instead of twice. topojson.feature() expands it into ordinary
    // GeoJSON that globe.gl understands.
    // ---------------------------------------------------------------
    fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json')
      .then(r => r.json())
      .then(topo => {
        const geo = topojson.feature(topo, topo.objects.countries);
        globe
          .polygonsData(geo.features)
          .polygonCapColor(f => countryColour(f))   // filled only while hovered
          .polygonSideColor(() => 'rgba(0,0,0,0)')  // no extruded walls
          .polygonStrokeColor(() => 'rgba(130,175,220,0.6)')
          .polygonAltitude(0.002)
          // Long enough to read as a fade rather than a flicker, short enough
          // that the country is lit before the eye has finished arriving.
          .polygonsTransitionDuration(200);

        globe.onPointHover(d => hoverMarker(d));
      })
      .catch(() => {
        // Borders are decoration. If the CDN is unreachable the globe
        // should still work rather than the whole page dying.
        console.warn('Country borders failed to load.');
      });

    // ---------------------------------------------------------------
    // PART 3: fetch the data, then draw the markers.
    // ---------------------------------------------------------------
    // Everything loaded from conflicts.json, and which conflict is open.
    let allConflicts = [];
    let activeConflict = null;

    // Events at curated places, keyed by conflict id then location name.
    // These are the matches the detector suppresses for MARKER creation
    // (the place already has a red marker) but which are still real
    // reports about that place. They used to be logged and thrown away.
    let autoEvents = {};

    // ---------------------------------------------------------------
    // Which countries light up when the cursor is over a conflict marker.
    //
    // This list is editorial, not geographic. It is the states the war is
    // actually between, plus territory being used to wage it. Not allies, not
    // suppliers, not the countries with an interest in the outcome: a reader
    // who wants to know who arms whom is not served by a hover state.
    //
    // The United States is in the Iran list because American aircraft struck
    // Natanz alongside Israel. That is not proxy support, it is a belligerent.
    //
    // Note the loose end that leaves: North Korean troops have fought on the
    // ground in Kursk, which is the same kind of participation, and North
    // Korea is not in the Ukraine list. Both calls are William's, but they do
    // not rest on the same rule, and if the site is ever asked to defend its
    // choices that is the one to look at first.
    //
    // Names must match the country data exactly. These were read off the
    // loaded features rather than guessed - 'Palestine' is a single feature
    // covering both the West Bank and Gaza, and the file writes several
    // countries in forms you would not type from memory.
    // ---------------------------------------------------------------
    const BELLIGERENTS = {
      ukraine: ['Ukraine', 'Russia', 'Belarus'],
      sudan:   ['Sudan'],
      gaza:    ['Israel', 'Palestine'],
      haiti:   ['Haiti'],
      iran:    ['Iran', 'Israel', 'United States of America'],
    };

    // Darker than the markers on purpose. The marker is the thing being
    // pointed at; the country is context behind it, and context that competes
    // with the marker for attention is doing the reader no favours.
    const COUNTRY_HIGHLIGHT = 'rgba(122,20,15,0.6)';

    let highlighted = new Set();

    function countryColour(f) {
      return highlighted.has(f.properties.name)
        ? COUNTRY_HIGHLIGHT
        : 'rgba(0,0,0,0)';
    }

    // onPointHover fires on every mouse move across a marker, and repainting
    // 241 country polygons each time is the difference between smooth and
    // stuttering. So: do nothing unless the set has actually changed.
    function setHighlight(names) {
      const unchanged = names.length === highlighted.size
        && names.every(n => highlighted.has(n));
      if (unchanged) return;
      highlighted = new Set(names);
      // A freshly created function every time. globe.gl compares accessors by
      // identity, and passing the same reference reads as "nothing changed".
      globe.polygonCapColor(f => countryColour(f));
    }

    // Auto-rotation belongs to the world view with nothing selected. Anywhere
    // else it is off, and it must stay off - so this is asked rather than
    // remembered. Restoring whatever the value was before a hover would turn
    // the spin back on if the reader clicked through to a conflict while the
    // cursor was still sitting on the marker.
    function rotationWanted() {
      return !activeConflict && !activeLocation;
    }

    // Hovering a marker stops the globe. Reading a country name off something
    // that is sliding out from under the cursor is the sort of small
    // frustration nobody reports and everybody feels.
    //
    // d is null when the cursor leaves the marker, which is what puts the
    // rotation back and clears the highlight.
    function hoverMarker(d) {
      globe.controls().autoRotate = d ? false : rotationWanted();

      // The country highlight is world level only: inside a conflict the
      // reader already knows whose war it is, and lighting whole countries
      // while they are reading a city is noise.
      const c = (!activeConflict && d && d.locations) ? d : null;
      setHighlight(c ? (BELLIGERENTS[c.id] || []) : []);
    }

    // The marker the reader has actually clicked. Everything else on the
    // globe dims away from it, and it is the only thing that pulses, so the
    // eye has one place to go.
    let activeLocation = null;
    let currentItems = [];

    // One kind of marker, one colour.
    //
    // There used to be two: red for places the site stands behind, purple
    // for places a scraper had found. The purple ones are gone. A marker is
    // an assertion that something happened at a point on the earth, and the
    // detector was not good enough to make it: it put 'Ethiopians' in Sudan,
    // 'Iranian' and 'Basij' in Iran and 'Haitian' in Haiti, having geocoded
    // demonyms as towns. A caption saying "unverified" does not undo a dot
    // planted on a map.
    //
    // What the detector finds still reaches the reader, on the right, as
    // reporting - which is what it always was.
    const MARKER_BRIGHT = '#ff2a1f';
    const MARKER_DIM    = '#4a1512';

    function markerColour(d) {
      if (!activeLocation) return MARKER_BRIGHT;
      return d === activeLocation ? MARKER_BRIGHT : MARKER_DIM;
    }

    // Which markers pulse: the selected one alone, or all of them when
    // nothing is selected.
    function ringItems() {
      if (activeLocation) return [activeLocation];
      return currentItems;
    }

    // globe.gl compares accessor functions BY IDENTITY. Passing the same
    // reference again reads as "nothing changed" and the redraw is skipped,
    // so every one of these has to be a freshly created arrow function. This
    // is not defensive style; it is the difference between the highlight
    // appearing and nothing happening at all.
    // A linear 1-t fade spends most of the ring's life almost invisible. The
    // eased curve holds it near full strength through the first half of its
    // travel and then drops away, which is what makes the pulse read as a
    // pulse rather than a faint smudge.
    function ringPaint() {
      const rgb = '255,60,48';
      const ease = ringStyle().ease;
      // ease 1 is the original linear fade; below 1 holds the ring near full
      // strength through the first half of its travel, which is what reads as
      // a pulse rather than a smudge.
      return t => `rgba(${rgb},${Math.pow(1 - t, ease).toFixed(3)})`;
    }

    // ---------------------------------------------------------------
    // Removing a ring that is already travelling.
    //
    // Four attempts failed before this one, all of them working through the
    // library: emptying ringsData, collapsing ringMaxRadius to zero, painting
    // the ring transparent, hiding the whole ring layer for a fixed window.
    // Measured in the browser on 6 Sep 2026, clicking a conflict marker:
    //
    //   immediately   data  0   meshes  5    (the 5 stale world rings)
    //   +400ms        data 15   meshes 20    (5 stale + 15 new)
    //   +5500ms       data 15   meshes 20    (the 5 stale are STILL there)
    //
    // globe.gl never removes a ring mesh. Not late - never. So no amount of
    // waiting works, which is why the timed blackout failed too: it hid the
    // stale rings for 1.6s and then showed them again, still travelling. At
    // the world view those rings are 8.75 degrees wide, so at city zoom they
    // spill right across the neighbouring countries.
    //
    // Every child of the ring layer carries a __data property holding the
    // datum it was built from. That is the handle the library does not give
    // us: a mesh whose __data is not in the current ringsData() is stale and
    // can be hidden on the spot. Done once per frame it needs no timers and
    // no guess about how long a ring takes to finish, and if globe.gl ever
    // recycles a mesh for a live datum it becomes visible again by itself.
    // ---------------------------------------------------------------
    let _ringLayer = null;

    function ringLayer() {
      if (_ringLayer) return _ringLayer;
      try {
        const data = globe.ringsData();
        if (!data.length) return null;          // nothing to identify it by yet
        const root = globe.scene().children.find(c => c.type === 'Group');
        if (!root) return null;
        _ringLayer = root.children.find(l => {
          const kids = l.children || [];
          if (!kids.length) return false;
          // The points layer also has one child per datum, but those are
          // meshes with their own geometry. Ring children are containers.
          if (kids[0].geometry) return false;
          return kids.some(k => data.indexOf(k.__data) !== -1);
        }) || null;
      } catch (e) {
        _ringLayer = null;
      }
      return _ringLayer;
    }

    // Hide every ring mesh whose datum is no longer being drawn. Guarded end
    // to end: if the library's internals change shape this quietly does
    // nothing, and the trails return as a cosmetic bug rather than the globe
    // breaking.
    function syncRings() {
      try {
        const layer = ringLayer();
        if (!layer) return;
        const data = globe.ringsData();
        // Backwards, because globe.gl appends. Leaving a level and coming back
        // to it leaves the old mesh in place AND builds a new one for the same
        // datum, so a marker ends up with two rings pulsing out of it, each
        // carrying whatever settings it was built with. Only the newest mesh
        // for any datum is the one the current settings apply to; every
        // earlier one is a leftover and is hidden with the rest.
        const seen = new Set();
        for (let i = layer.children.length - 1; i >= 0; i--) {
          const child = layer.children[i];
          const live = data.indexOf(child.__data) !== -1 && !seen.has(child.__data);
          if (live) seen.add(child.__data);
          if (child.visible !== live) child.visible = live;
        }
      } catch (e) { /* cosmetic only */ }
    }

    // Once per drawn frame, so a stale ring is hidden before it is ever
    // painted. requestAnimationFrame stops in a hidden tab, which is exactly
    // when nothing needs hiding — but a slow interval as well means the state
    // is never left wrong for long if the page comes back into view mid-cycle.
    (function ringJanitor() {
      syncRings();
      requestAnimationFrame(ringJanitor);
    })();
    setInterval(syncRings, 200);

    // Emptying the data is what makes every existing ring stale; syncRings
    // then hides it. Called directly as well as once per frame so the change
    // lands on this frame rather than the next.
    function clearRings() {
      globe.ringsData([]);
      syncRings();
    }

    // Split because the two want different timing. Marker colour should change
    // the instant you click. Rings must stay collapsed for a frame first, or
    // restoring the radius immediately hands the lingering meshes something to
    // expand into again and the trail comes straight back.
    function refreshPointColours() {
      globe.pointColor(d => markerColour(d));
    }

    function refreshRings() {
      globe
        .ringsData(ringItems())
        .ringMaxRadius(d => ringRadius(d))
        .ringPropagationSpeed(ringStyle().speed)
        .ringRepeatPeriod(ringStyle().period)
        .ringColor(() => ringPaint());
    }

    function refreshMarkerStyling() {
      refreshPointColours();
      refreshRings();
    }

    // True while the camera is flying somewhere under our own instruction.
    // Without this, the "zoom out to go back" rule below fires during the
    // fly-in, because the camera passes through the trigger altitude on the
    // way down. A handler must not react to a movement we caused ourselves.
    let navigating = false;

    function flyTo(pov, ms) {
      navigating = true;

      // Size the markers for where the camera is GOING, not where it is.
      // Otherwise new markers appear at the old altitude's size and then
      // visibly shrink as the camera catches up, which reads as lag.
      if (typeof pov.altitude === 'number') {
        cameraAltitude = pov.altitude;
        globe.pointRadius(d => markerRadius(d)).ringMaxRadius(d => ringRadius(d));
      }
      // Deferred by one tick on purpose. Rebuilding the marker geometry and
      // starting a camera transition in the same frame cancels the
      // transition: the camera simply never moves, silently. Letting the
      // geometry settle first costs 60ms and makes it reliable.
      setTimeout(() => globe.pointOfView(pov, ms), 60);
      setTimeout(() => { navigating = false; }, ms + 400);
    }

    // Load the auto-detected layer in the background. A failure here must
    // never stop the globe loading, so it only ever logs a warning.
    fetch('auto-locations.json')
      .then(r => (r.ok ? r.json() : null))
      .then(data => {
        // data.conflicts is the detector's own list of places. It is still
        // written by the pipeline and still feeds the confidence ladder, but
        // nothing on the site reads it any more: those guesses were not good
        // enough to put a dot on a map with.
        if (data && data.events) autoEvents = data.events;
      })
      .catch(() => console.warn('auto-locations.json not loaded; showing curated markers only.'));

    // Curated locations only. The detector's own place guesses are no longer
    // put on the globe at all; see the note on marker colour above.
    function locationsFor(c) {
      return c.locations || [];
    }

    fetch('conflicts.json')
      .then(response => response.json())
      .then(conflicts => {
        allConflicts = conflicts;

        // First paint: no transition (there is nothing to animate from), and
        // swallow marker clicks for a beat. globe.gl counts a stray pointer
        // down+up near a marker as a click; one landing during load would
        // fire openConflict and leave a country's locations on the world view.
        navigating = true;
        drawMarkers(conflicts, 0);
        setTimeout(() => { navigating = false; }, 800);

        globe.onZoom(pov => {
          // Ignore camera movement we started ourselves. flyTo has already
          // set the size for the destination; recalculating from the
          // in-flight altitude would undo it frame by frame.
          if (navigating) return;
          if (Math.abs(pov.altitude - cameraAltitude) / cameraAltitude < 0.004) return;
          cameraAltitude = pov.altitude;
          globe.pointRadius(d => markerRadius(d)).ringMaxRadius(d => ringRadius(d));

          // Pulling back far enough returns you to the world view, so you
          // are never stuck inside a country with no way out but the button.
          if (activeConflict && pov.altitude > 1.7) showWorld();
        });
      });

    // One place that puts markers on the globe, whichever level we are at.
    function drawMarkers(items, ms) {
      // globe.gl can animate markers appearing and disappearing, but the
      // same setting also applies to the radius updates we fire on every
      // zoom tick. Left on, resizing lags behind the camera and smears.
      //
      // So: turn the animation on for the swap, then turn it straight back
      // off once the new markers have grown in.
      // Note: globe.gl has pointsTransitionDuration but there is no
      // ringsTransitionDuration. Assuming symmetry here threw a TypeError
      // that silently wiped every marker on the globe.
      const dur = (ms === undefined) ? 550 : ms;
      globe.pointsTransitionDuration(dur);
      setTimeout(() => globe.pointsTransitionDuration(0), dur + 120);

      currentItems = items;
      globe
        .pointsData(items)
        .pointLat(d => d.lat)
        .pointLng(d => d.lng)
        .pointAltitude(0.004)
        .pointRadius(d => markerRadius(d))
        .pointColor(d => markerColour(d))
        .pointLabel(d => d.name)
        // Ignore clicks that land while the camera is already moving - during
        // the load settle or any flyTo. Without this a click meant for empty
        // space, caught mid-flight, navigates somewhere unexpected.
        .onPointClick(d => { if (navigating) return; return d.locations ? openConflict(d) : openLocation(d); })
        .ringsData(ringItems())
        .ringLat(d => d.lat)
        .ringLng(d => d.lng)
        // Above the country borders, which sit at 0.002.
        //
        // The borders are drawn as polygons with a fully transparent fill, and
        // a transparent material in three.js still writes to the depth buffer:
        // invisible geometry, but it occludes anything underneath it just the
        // same. Rings at the default 0.0015 were therefore being punched
        // through wherever a country's fill covered them, so a ring came out
        // chopped along the coastline or the border it crossed. Lifting them
        // above that layer is all it takes; 0.003 still sits below the marker
        // cylinders at 0.004, so the marker stays on top of its own ring.
        .ringAltitude(0.003)
        .ringMaxRadius(d => ringRadius(d))
        .ringPropagationSpeed(ringStyle().speed)
        .ringRepeatPeriod(ringStyle().period)
        .ringColor(() => ringPaint());
    }

    // ---------------------------------------------------------------
    // PART 5: the panel, and moving between the two levels.
    // ---------------------------------------------------------------
    const panel = document.getElementById('panel');
    const panelBack = document.getElementById('panel-back');
    const newsPanel = document.getElementById('news-panel');
    const viz = document.getElementById('globeViz');

    // ---------------------------------------------------------------
    // The globe sits between the panels, so it has to be resized when they
    // move. CSS moves the box; the canvas needs telling separately, because
    // a WebGL drawing buffer left at its old dimensions comes out stretched.
    //
    // Coalesced to one call per frame: the panel slide fires a resize on
    // every frame of its 350ms transition, and rebuilding the renderer
    // twenty times in a row for the same end state is wasted work.
    // ---------------------------------------------------------------
    let _sizeQueued = false;

    function sizeGlobe() {
      if (_sizeQueued) return;
      _sizeQueued = true;
      requestAnimationFrame(() => {
        _sizeQueued = false;
        const r = viz.getBoundingClientRect();
        if (r.width > 0 && r.height > 0) globe.width(r.width).height(r.height);
      });
    }

    new ResizeObserver(sizeGlobe).observe(viz);
    sizeGlobe();

    // Both panels tell the body what is open, and the body is what moves the
    // globe. One place decides, rather than every call site remembering.
    function setLeftPanel(open) {
      panel.classList.toggle('open', open);
      document.body.classList.toggle('left-open', open);
    }

    function closeNews() {
      newsPanel.classList.remove('open');
      document.body.classList.remove('right-open');
    }

    // What is being SAID about the selected thing: unverified reports first,
    // then press coverage. Pass a location for one place, or null for the
    // conflict as a whole.
    function showReporting(d, conflict) {
      if (!conflict) { closeNews(); return; }

      document.getElementById('news-head').innerHTML =
        '<strong>' + escapeHtml(d ? d.name : conflict.name) + '</strong>'
        + (d ? 'What is being reported here' : 'Reported across this conflict');

      showEvents(d, conflict);
      loadNews(d || conflict);

      newsPanel.classList.add('open');
      document.body.classList.add('right-open');
    }

    // Minimising leaves a labelled rail rather than hiding the panel, so the
    // reader can tell there is something there to bring back.
    document.getElementById('news-min').addEventListener('click', () => {
      const min = !newsPanel.classList.contains('min');
      newsPanel.classList.toggle('min', min);
      document.body.classList.toggle('right-min', min);
      document.getElementById('news-min').title = min
        ? 'Show reporting' : 'Hide reporting';
    });

    // Level 1: every conflict, one marker each.
    function showWorld() {
      clearRings();
      setHighlight([]);
      activeConflict = null;
      activeLocation = null;
      panelBack.classList.remove('visible');
      setLeftPanel(false);
      closeNews();
      globe.controls().autoRotate = true;
      flyTo({ altitude: 2.5 }, 1400);

      // Same idea on the way out: let the camera start pulling back before
      // the location markers give way to the conflict markers.
      setTimeout(() => drawMarkers(allConflicts), 500);
    }

    // Level 2: one conflict, its locations.
    function openConflict(c) {
      clearRings();
      setHighlight([]);   // the cursor may still be on the marker we just left
      activeConflict = c;
      activeLocation = null;   // a new level of the map, nothing selected in it yet
      panelBack.classList.add('visible');

      fillPanel(c);
      showLocationList(c);
      showReporting(null, c);   // the conflict's recent reporting, all places

      globe.controls().autoRotate = false;
      flyTo({ lat: c.lat, lng: c.lng, altitude: 0.85 }, 1800);

      // Swap the markers a third of the way into the flight rather than
      // before it. The country is already growing on screen, so the new
      // locations appear to emerge from it instead of replacing it.
      setTimeout(() => drawMarkers(locationsFor(c)), 600);
    }

    // A single place inside a conflict.
    function openLocation(d) {
      clearRings();
      activeLocation = d;
      refreshPointColours();
      // One frame with the old rings hidden before the new one grows.
      // setTimeout rather than requestAnimationFrame: rAF never fires in a
      // hidden tab, and the selected ring must not depend on being watched.
      setTimeout(refreshRings, 32);
      fillPanel(d);
      showReporting(d, activeConflict);
      document.getElementById('panel-locations').innerHTML = '';
      globe.controls().autoRotate = false;
      flyTo({ lat: d.lat, lng: d.lng, altitude: 0.45 }, 1300);
    }

    // Shared: title, meta, summary, sources, news. Works for either level.
    function fillPanel(d) {
      document.getElementById('panel-title').textContent = d.name;

      const summary = document.getElementById('panel-summary');

      document.getElementById('panel-meta').textContent =
        (d.type || (activeConflict ? activeConflict.name : '')) +
        (d.updated ? ' \u00b7 updated ' + d.updated : '');

      if (d.summary && d.summary.trim()) {
        summary.textContent = d.summary;
        summary.style.color = '';
      } else {
        summary.textContent = 'No write-up yet.';
        summary.style.color = 'rgba(255,255,255,0.3)';
      }

      setLeftPanel(true);
      showKeyEvents(d);
      showSources(d);
    }

    // The clickable list of places, so you can navigate from the panel
    // as well as from the globe.
    function showLocationList(c) {
      const box = document.getElementById('panel-locations');
      const curated = c.locations || [];

      if (curated.length === 0) { box.innerHTML = ''; return; }
      box.innerHTML = '';

      // Alphabetical. The file order was the order things happened to be
      // written in, which means nothing to a reader.
      const az = (a, b) => a.name.localeCompare(b.name, 'en');
      addLocSection('Locations', curated.slice().sort(az), '');

      function addLocSection(heading, list, kind) {
        if (list.length === 0) return;
        const sub = kind ? ' loc-heading-' + kind : '';
        const h = document.createElement('div');
        h.className = 'loc-heading' + sub;
        h.textContent = heading;
        box.appendChild(h);

        list.forEach(loc => {
          const b = document.createElement('button');
          b.className = 'loc-item' + (kind ? ' loc-item-auto loc-item-' + kind : '');
          const count = kind
            ? '<span class="loc-count">' + escapeHtml(String(loc.count)) + '</span>'
            : '';
          const dot = '<span class="loc-dot' + (kind ? ' loc-dot-' + kind : '') + '"></span>';
          b.innerHTML = '<span>' + escapeHtml(loc.name) + '</span>' + count + dot;
          b.addEventListener('click', () => openLocation(loc));
          box.appendChild(b);
        });
      }
    }

    panelBack.addEventListener('click', () => showWorld());

    document.getElementById('panel-close').addEventListener('click', () => {
      // Closing the panel deselects. Otherwise the globe keeps one marker lit
      // for something the reader is no longer looking at.
      activeLocation = null;
      clearRings();
      refreshPointColours();
      setTimeout(refreshRings, 80);
      setLeftPanel(false);
      // Deselecting a place does not mean the reader has left the conflict,
      // so the reporting panel falls back to the conflict as a whole.
      showReporting(null, activeConflict);
      if (!activeConflict) globe.controls().autoRotate = true;
    });

    // ---------------------------------------------------------------
    // PART 6: live news from GDELT.
    // YOUR CODE GOES HERE. See the instructions in chat.
    // ---------------------------------------------------------------
    // Words that suggest an article is about the conflict rather than
    // about politics, markets or sport happening near the same place.
    const CONFLICT_WORDS = [
      'strike', 'drone', 'missile', 'attack', 'shell', 'offensive', 'fighting',
      'clash', 'killed', 'wounded', 'casualt', 'troops', 'forces', 'siege',
      'bomb', 'ceasefire', 'front line', 'frontline', 'assault', 'raid',
      'gunmen', 'militia', 'rebels', 'evacuat', 'displaced'
    ];

    // Results are cached per conflict so clicking the same marker twice
    // does not mean waiting on GDELT twice.
    const newsCache = {};

    // Anything from GDELT is untrusted text. Escape it before it goes
    // anywhere near innerHTML.
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // Strip punctuation and case so syndicated copies of the same story
    // collapse to one entry.
    function titleKey(s) {
      return String(s).toLowerCase().replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ').trim().slice(0, 55);
    }

    // Rank rather than filter. Filtering on one rule threw everything away.
    function scoreArticle(a, d) {
      const title = (a.title || '').toLowerCase();
      let score = 0;
      if ((d.match || []).some(m => title.includes(m.toLowerCase()))) score += 3;
      if (CONFLICT_WORDS.some(w => title.includes(w))) score += 1;
      if (a.language === 'English') score += 2;
      return score;
    }

    // GDELT reports languages by name. MyMemory wants ISO codes.
    const LANG_CODES = {
      Ukrainian: 'uk', Russian: 'ru', Polish: 'pl', Czech: 'cs', Slovak: 'sk',
      Hungarian: 'hu', Romanian: 'ro', Bulgarian: 'bg', Serbian: 'sr',
      Croatian: 'hr', Bosnian: 'bs', Slovenian: 'sl', Macedonian: 'mk',
      Albanian: 'sq', Greek: 'el', Turkish: 'tr', Arabic: 'ar', Hebrew: 'he',
      Persian: 'fa', Pashto: 'ps', Kurdish: 'ku', Urdu: 'ur', Hindi: 'hi',
      Bengali: 'bn', Nepali: 'ne', Burmese: 'my', Thai: 'th',
      Vietnamese: 'vi', Indonesian: 'id', Malay: 'ms', Filipino: 'tl',
      Chinese: 'zh', Japanese: 'ja', Korean: 'ko', French: 'fr',
      Spanish: 'es', Portuguese: 'pt', Italian: 'it', German: 'de',
      Dutch: 'nl', Swedish: 'sv', Norwegian: 'no', Danish: 'da',
      Finnish: 'fi', Estonian: 'et', Latvian: 'lv', Lithuanian: 'lt',
      Georgian: 'ka', Armenian: 'hy', Azerbaijani: 'az', Somali: 'so',
      Amharic: 'am', Swahili: 'sw'
    };

    // Translations are stable, so keep them between visits. Wrapped in
    // try/catch because private browsing can make localStorage throw.
    const TRANSLATION_STORE = 'conflictGlobeTranslations';
    let translationCache = {};
    try {
      translationCache = JSON.parse(localStorage.getItem(TRANSLATION_STORE) || '{}');
    } catch (e) {
      translationCache = {};
    }

    function saveTranslations() {
      try {
        localStorage.setItem(TRANSLATION_STORE, JSON.stringify(translationCache));
      } catch (e) {
        // Storage full or unavailable. Not worth breaking the page over.
      }
    }

    // Returns the article with a `titleEn` added, or unchanged if the
    // headline is already English, the language is unknown, or the
    // service fails. Never rejects: a missing translation is not an error.
    function translateArticle(a) {
      if (!a.language || a.language === 'English') return Promise.resolve(a);

      const code = LANG_CODES[a.language];
      if (!code) return Promise.resolve(a);

      const key = code + '|' + a.title;
      if (translationCache[key]) {
        a.titleEn = translationCache[key];
        return Promise.resolve(a);
      }

      const url = 'https://api.mymemory.translated.net/get'
        + '?q=' + encodeURIComponent(a.title.slice(0, 480))
        + '&langpair=' + code + '|en';

      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 8000);

      return fetch(url, { signal: controller.signal })
        .then(r => r.json())
        .then(j => {
          const out = j && j.responseData && j.responseData.translatedText;
          // MyMemory returns its own error text in this field when it fails,
          // so reject anything that looks like a complaint rather than a
          // translation.
          if (out && !/^[A-Z ]*(QUERY LENGTH|INVALID|INVALID LANGUAGE|MYMEMORY WARNING)/i.test(out)) {
            a.titleEn = out;
            translationCache[key] = out;
          }
          return a;
        })
        .catch(() => a)
        .finally(() => clearTimeout(timer));
    }

    // ---------------------------------------------------------------
    // Headline cleanup, using Chrome's on-device language model.
    //
    // Machine translation produces readable but clumsy English. This
    // rewrites it into plain English. It runs entirely on the reader's
    // machine: no API key, no server, no cost, nothing sent anywhere.
    //
    // It only exists in recent Chrome. Everywhere else the site falls
    // back to the raw translation, which is why this never blocks
    // anything and never throws.
    // ---------------------------------------------------------------
    // OFF by default. Deliberately.
    //
    // The rewrite makes headlines read better and makes them less accurate,
    // which is the worst combination for a site about conflict. Measured
    // examples from real output:
    //
    //   "Герань-4" (a Geran-4 strike drone)
    //     -> translated as "Geranium-4", clumsy but the name survives
    //     -> rewritten as "an explosion involving a geranium"
    //        The only militarily meaningful word became a flower.
    //
    //   "на вокзалі утворився колапс" (gridlock at the station)
    //     -> rewritten as "causes a settlement to collapse"
    //
    //   "знищили" (destroyed) -> quietly softened to "damaged"
    //
    // Clumsy English signals "machine output, verify this". Fluent English
    // signals "a person wrote this". Making wrong text fluent removes the
    // reader's only warning. Set to true only with a plan for catching this.
    const HEADLINE_CLEANUP = false;

    let cleanupModel = null;
    let cleanupUnavailable = false;

    const CLEANUP_RULES = 'You rewrite awkward machine-translated news headlines into clear, '
      + 'plain English. Never add facts that are not in the input. Never guess. Never invent '
      + 'numbers, places or casualties. Keep it under 20 words. Reply with the rewritten '
      + 'headline only, nothing else.';

    async function getCleanupModel() {
      if (!HEADLINE_CLEANUP) return null;
      if (cleanupUnavailable) return null;
      if (cleanupModel) return cleanupModel;

      if (typeof LanguageModel === 'undefined') { cleanupUnavailable = true; return null; }

      try {
        // "available" means the model is already on this machine. Anything
        // else would mean a large download, which we are not going to
        // trigger on someone's behalf.
        if (await LanguageModel.availability() !== 'available') {
          cleanupUnavailable = true;
          return null;
        }
        cleanupModel = await LanguageModel.create({
          initialPrompts: [{ role: 'system', content: CLEANUP_RULES }]
        });
        return cleanupModel;
      } catch (e) {
        cleanupUnavailable = true;
        return null;
      }
    }

    // Adds `titleClean` where it can. Returns true if anything changed.
    async function polishHeadlines(articles) {
      const model = await getCleanupModel();
      if (!model) return false;

      let changed = false;

      for (const a of articles) {
        if (!a.titleEn) continue;              // only touch machine translations

        const key = 'polish|' + a.titleEn;
        if (translationCache[key]) {
          a.titleClean = translationCache[key];
          changed = true;
          continue;
        }

        try {
          // A session remembers everything it has been asked. Reusing one
          // across headlines let details from one story leak into the next,
          // which produced a confident sentence about a destroyed toy shop
          // in a headline that was about air-raid sirens.
          //
          // clone() gives a fresh session with the system prompt and no
          // history, so every headline is rewritten in isolation.
          const isolated = await model.clone();
          let out;
          try {
            out = (await isolated.prompt(a.titleEn) || '').trim().replace(/^["']|["']$/g, '');
          } finally {
            isolated.destroy();
          }

          // Reject anything suspicious: empty, rambling, or a refusal.
          if (out && out.length > 8 && out.length < 200) {
            a.titleClean = out;
            translationCache[key] = out;
            changed = true;
          }
        } catch (e) {
          // One failed headline should not stop the rest.
        }
      }

      saveTranslations();
      return changed;
    }

    function loadNews(d) {
      const news = document.getElementById('panel-news');

      if (newsCache[d.name]) {
        renderNews(newsCache[d.name].articles, newsCache[d.name].weak);
        return;
      }

      news.innerHTML = '<p class="news-status">Loading recent coverage. '
        + 'GDELT is slow and can take half a minute.</p>';

      const url = 'https://api.gdeltproject.org/api/v2/doc/doc'
        + '?query=' + encodeURIComponent(d.query)
        + '&mode=artlist&format=json&maxrecords=75&sort=hybridrel&timespan=7d';

      const controller = new AbortController();
      // GDELT was measured at 23-24s per query from a GitHub runner on
      // 31 Aug 2026. A 22s abort sits inside that margin, which is exactly
      // the bug that made the confidence ladder return nothing: every good
      // query killed a few seconds early. Browsers are usually quicker than
      // that runner, so this was marginal rather than broken — but marginal
      // against a measured 24s is not a margin.
      const timer = setTimeout(() => controller.abort(), 45000);

      fetch(url, { signal: controller.signal })
        .then(r => r.text())
        .then(text => {
          clearTimeout(timer);

          let data;
          try {
            data = JSON.parse(text);
          } catch (e) {
            news.innerHTML = '<p class="news-status">GDELT rejected the query: '
              + escapeHtml(text.slice(0, 200)) + '</p>';
            return;
          }

          const seen = new Set();
          const ranked = (data.articles || [])
            .filter(a => a.title && a.url)
            .map(a => Object.assign({}, a, { score: scoreArticle(a, d) }))
            .filter(a => {
              const k = titleKey(a.title);
              if (seen.has(k)) return false;
              seen.add(k);
              return true;
            })
            .sort((x, y) => (y.score - x.score) || String(y.seendate).localeCompare(String(x.seendate)));

          const strong = ranked.filter(a => a.score >= 3);
          // Never show an empty panel when there was something to show.
          const weak = strong.length === 0 && ranked.length > 0;
          const articles = (weak ? ranked : strong).slice(0, 10);

          // Translate the non-English headlines before showing anything,
          // so the list does not visibly rewrite itself under the reader.
          renderNews(articles, weak);
          Promise.all(articles.map(translateArticle)).then(translated => {
            saveTranslations();
            newsCache[d.name] = { articles: translated, weak: weak };
            renderNews(translated, weak);

            // Then quietly improve the wording in the background. Each
            // headline takes a few seconds, so this re-renders once at
            // the end rather than making the list twitch line by line.
            polishHeadlines(translated).then(changed => {
              if (changed) renderNews(translated, weak);
            });
          });
        })
        .catch(err => {
          clearTimeout(timer);
          // Say which part failed. GDELT is a free service with no uptime
          // guarantee and it went unreachable entirely on 31 Aug 2026 — four
          // separate networks, no TCP connection. A reader seeing "could not
          // load" assumes this site is broken; they should be told that the
          // news source is down and that everything else on the page still
          // stands on its own sources.
          news.innerHTML = '<p class="news-status">'
            + (err.name === 'AbortError'
                ? 'The news service (GDELT) did not respond in time.'
                : 'The news service (GDELT) is unreachable right now.')
            + '<br>Key events and the write-ups above are unaffected — '
            + 'they come from cited sources, not from this feed.</p>';
        });
    }

    function renderNews(articles, weak) {
      const news = document.getElementById('panel-news');

      if (!articles || articles.length === 0) {
        news.innerHTML = '<p class="news-status">No coverage found in the last 7 days.</p>';
        return;
      }

      const heading = weak
        ? '<div class="news-heading">Recent coverage &middot; loosely matched</div>'
        : '<div class="news-heading">Recent coverage</div>';

      news.innerHTML = heading + articles.map(a => {
        const safeUrl = /^https?:\/\//i.test(a.url) ? escapeHtml(a.url) : '#';
        // Say plainly when a headline has been machine-processed.
        const lang = a.language && a.language !== 'English'
          ? ' &middot; ' + escapeHtml(a.language) + (a.titleEn ? ' &middot; auto-translated' : '')
          : '';
        // Show the translation as the headline, but keep the original
        // underneath. The reader can always see what was actually published.
        const headline = a.titleClean || a.titleEn || a.title;
        const original = a.titleEn
          ? '<span class="news-original">' + escapeHtml(a.title) + '</span>'
          : '';

        return '<a class="news-item" href="' + safeUrl + '" target="_blank" rel="noopener">'
          + '<span class="news-title">' + escapeHtml(headline) + '</span>'
          + original
          + '<span class="news-source">' + escapeHtml(a.domain) + ' &middot; '
          + formatDate(a.seendate) + lang + '</span>'
          + '</a>';
      }).join('');
    }


    // ---------------------------------------------------------------
    // Recent events at a place, from the trusted Telegram channels.
    //
    // Grouped by calendar day, newest first, because a single attack is
    // reported in fragments over several hours: Belgorod on 30 August
    // arrived as six posts between 14:00 and 17:38, from the first
    // explosions to Ozon confirming its depot was hit. Listed flat that
    // reads as six separate attacks.
    //
    // Every report stays its own line. The display layer deliberately
    // does NOT merge a weapon from one post with a target from another:
    // that is the same cross-event leak that once put 38 deaths on the
    // wrong city, and it would be no more true here than in the parser.
    // ---------------------------------------------------------------
    // Curated history: the handful of events that changed what this place
    // is, oldest first. Distinct from the Telegram feed below it in both
    // colour and certainty — these are checked and dated, that is reported
    // and unverified, and the panel should never let the two blur.
    //
    // Where an event has two defensible dates the alternative is carried in
    // `note` and shown, rather than being resolved silently. A recorded
    // disagreement is worth more than a clean-looking single number.
    function showKeyEvents(d) {
      const box = document.getElementById('panel-key-events');
      if (!box) return;
      const list = d.keyEvents || [];
      if (list.length === 0) { box.innerHTML = ''; return; }

      box.innerHTML = '<div class="news-heading">Key events</div>'
        + list.map(e => {
            // The citation is the point. Every one of these dates was checked
            // against a specific source; showing the domain lets a reader see
            // what kind of source before they click, and an event with no
            // citation shows none — the absence is the honest signal, not
            // something to paper over with a plausible-looking link.
            let cite = '';
            if (/^https?:\/\//i.test(e.source || '')) {
              let host = '';
              try { host = new URL(e.source).hostname.replace(/^www\./, ''); }
              catch (err) { host = 'source'; }
              cite = '<a class="ke-src" href="' + escapeHtml(e.source) + '"'
                   + ' target="_blank" rel="noopener">' + escapeHtml(host) + '</a>';
            }
            return '<div class="ke-item">'
              + '<span class="ke-date">' + escapeHtml(formatShortDate(e.date)) + '</span>'
              + '<span class="ke-text">' + escapeHtml(e.text)
              + (e.note ? '<span class="ke-note">' + escapeHtml(e.note) + '</span>' : '')
              + cite
              + '</span></div>';
          }).join('');
    }

    function formatShortDate(iso) {
      const m = ['Jan','Feb','Mar','Apr','May','Jun',
                 'Jul','Aug','Sep','Oct','Nov','Dec'];
      const p = String(iso).split('-');
      return String(Number(p[2])) + ' ' + m[Number(p[1]) - 1] + ' ' + p[0];
    }

    // d is a location, or null for every place in the conflict at once.
    // At conflict level each row is labelled with its place, because
    // 'a drone hit a substation' means nothing without knowing where.
    function showEvents(d, conflict) {
      const box = document.getElementById('panel-events');
      if (!box) return;

      const forConflict = (conflict && autoEvents[conflict.id]) || {};

      let list;
      if (d) {
        list = (forConflict[d.name] || []).map(e => Object.assign({}, e, { place: null }));
      } else {
        list = Object.keys(forConflict).reduce((acc, place) => acc.concat(
          forConflict[place].map(e => Object.assign({}, e, { place: place }))
        ), []);
      }

      // Drop the posts that are not reporting anything before counting or
      // grouping, so a day that produced four posts and no news does not
      // announce itself as '4 reports'.
      const total = list.length;
      list = list.filter(e => worthShowing(cleanReport(e.sentence || e.excerpt || '')));
      const skipped = total - list.length;

      if (list.length === 0) {
        box.innerHTML = total
          ? '<div class="news-heading">Recent reports</div>'
            + '<p class="news-status">' + total + ' post'
            + (total === 1 ? '' : 's') + ' from the monitored channels, none of them '
            + 'reporting an event here.</p>'
          : '';
        return;
      }

      // Capped. A conflict with 261 reports across 14 places is a wall of
      // text nobody reads to the end of, and the oldest of them are the
      // least worth the reader's attention.
      const sorted = list.slice()
        .sort((a, b) => String(b.at).localeCompare(String(a.at)))
        .slice(0, d ? 400 : 60);

      const days = [];
      sorted.forEach(e => {
        const day = String(e.at).slice(0, 10);
        const last = days[days.length - 1];
        if (last && last.day === day) last.items.push(e);
        else days.push({ day: day, items: [e] });
      });

      box.innerHTML =
        // Only claim the whole section is unverified while it actually is.
        // Once anything in it has been corroborated the blanket label is a
        // false statement, and each row carries its own source line anyway.
        '<div class="news-heading">Recent reports'
        + (sorted.every(e => (e.status || 'reported') === 'reported')
             ? ' <span class="ev-unver">unverified</span>' : '')
        + '</div>'
        // Say what was left out rather than quietly dropping it.
        + (skipped
            ? '<p class="news-status">' + skipped + ' further post'
              + (skipped === 1 ? '' : 's') + ' set aside as comment rather than '
              + 'reporting.</p>'
            : '')
        + days.map(g => {
            const times = g.items.map(e => String(e.at).slice(11, 16)).sort();
            const span = times.length > 1
              ? times[0] + '–' + times[times.length - 1]
              : times[0];
            return '<div class="ev-day">'
              + '<div class="ev-day-head">'
              + '<span class="ev-date">' + escapeHtml(formatDay(g.day)) + '</span>'
              + '<span class="ev-count">' + g.items.length + ' report'
              + (g.items.length === 1 ? '' : 's') + ' · ' + escapeHtml(span)
              + '</span></div>'
              + g.items.map(renderEvent).join('')
              + '</div>';
          }).join('');
    }

    // One report, rendered by its rung on the confidence ladder.
    //   'reported'      -> one source. Shown in that source's own words,
    //                      prefixed with the channel name so the grammar
    //                      makes clear who is speaking, not the site.
    //   'corroborated'+ -> a second independent source, or news pickup.
    //                      Gets the structured line the parser produced,
    //                      with the source sentence underneath to check it.
    // ---------------------------------------------------------------
    // Turning a Telegram post into a line worth reading.
    //
    // What arrives is written for a Telegram feed: flag emojis, lightning
    // bolts, channel handles, an occasional link. Quoting it verbatim put all
    // of that on the page and made the reader do the work of finding the
    // sentence inside it. The decoration carries no information, so it goes.
    // ---------------------------------------------------------------
    const REPORT_DECOR =
      /[\p{Extended_Pictographic}\u{1F1E6}-\u{1F1FF}\u{FE0F}\u{20E3}\u{2190}-\u{21FF}\u{2600}-\u{27BF}]/gu;

    function cleanReport(t) {
      return (t || '')
        .replace(REPORT_DECOR, ' ')
        .replace(/@[A-Za-z0-9_]{3,}/g, ' ')       // channel handles
        .replace(/https?:\/\/\S+/g, ' ')          // bare links
        .replace(/^[\s\u2026\u2014\u2013\-:|,."'\u00ab\u00bb]+/, '')
        .replace(/^(?:meanwhile|also|and)[,\s]+/i, '')
        .replace(/[\s\u2026]+$/, '')
        .replace(/\s{2,}/g, ' ')
        .trim();
    }

    // Not everything a war channel posts is news. Roughly one post in
    // fourteen is somebody talking ABOUT the war rather than reporting it:
    // a spokesman characterising a strike, a president promising something,
    // a channel cheering. Those are dropped.
    //
    // The one rule worth stating: a speech verb at the START means somebody
    // is talking, but the same verb at the END is an attribution on a real
    // event - 'a building was damaged, officials said'. So a speech opening
    // only rejects the line when nothing hard survives it: no damage done,
    // no count of the dead. 'Zelensky said the attack killed 17' stays.
    const R_EVENT = /\b(strike|struck|strikes|hit|hits|shell|shelled|shelling|attack|attacked|drone|drones|missile|missiles|explosion|explosions|blast|fire|burn(?:ed|t|ing)?|blaze|destroyed|damaged|killed|killing|wounded|injured|casualt|shot down|intercepted|downed|captured|seized|advanc|evacuat|shelter|bomb|bombed|refinery|substation|airport|hospital|school)\b/i;
    const R_DAMAGE = /\b(struck|hit|destroyed|damaged|burn(?:ed|t|ing)|blaze|caught fire|exploded|detonat|shelled|shot down|downed|intercepted|collapsed|derailed)\b/i;
    const R_NUM = '(?:\\d+|one|two|three|four|five|six|seven|eight|nine|ten|dozens|hundreds)';
    const R_CASUALTY = new RegExp(
      '\\b' + R_NUM + '\\s*(?:[a-z\u2019\'-]+\\s+){0,4}(?:were\\s+|are\\s+)?(?:killed|dead|wounded|injured)\\b'
      + '|\\b(?:killed|killing|wounded|wounding|injured|injuring|toll)\\b[^.]{0,20}\\b' + R_NUM, 'i');
    const R_SPEECH_LEAD =
      /^(?:[A-Z][\w.'\u2019-]*\s+|of\s+|the\s+){1,5}(?:says?|said|claims?|claimed|announced|promised|warns?|warned|threatened|denied|accused|insists?|urges?|called|reports?)\b/;
    const R_INTENT = /\b(is considering|plans to|planning to|intends to|may launch|could launch|would launch|is expected to|threatened to|promised (?:not )?to|is preparing to|would rather)\b/i;
    const R_META = /^(i remind|for a moment|subscribe|read more|follow us|as a reminder|it seems|reminder|more from|some reactions|video|photo|footage)|(?:reactions from|has published|are cheering|is cheering)/i;

    function worthShowing(c) {
      if (!c || c.length < 25) return false;
      if (!R_EVENT.test(c)) return false;
      if (R_META.test(c)) return false;
      if (R_INTENT.test(c)) return false;
      if (R_SPEECH_LEAD.test(c) && !(R_DAMAGE.test(c) || R_CASUALTY.test(c))) return false;
      return true;
    }

    // Whatever the parser managed to pull out, as chips. Never invented: an
    // empty facts row means the post did not say.
    function factChips(p) {
      if (!p) return '';
      const bits = [];
      if (p.weapon)     bits.push('<span class="ev-fact">' + escapeHtml(cap(p.weapon)) + '</span>');
      if (p.targetType) bits.push('<span class="ev-fact">' + escapeHtml(p.targetType) + '</span>');
      if (p.target && (!p.targetType || p.target.toLowerCase() !== p.targetType.toLowerCase()))
        bits.push('<span class="ev-fact">' + escapeHtml(p.target) + '</span>');
      if (p.casualties) bits.push('<span class="ev-fact ev-fact-cas">' + escapeHtml(p.casualties) + '</span>');
      return bits.length ? '<span class="ev-facts">' + bits.join('') + '</span>' : '';
    }

    function renderEvent(e) {
      const p = e.parsed;
      const place = e.place
        ? '<span class="ev-place">' + escapeHtml(e.place) + '</span>'
        : '';
      const safeUrl = /^https:\/\/t\.me\//.test(e.url) ? escapeHtml(e.url) : '';
      const status = e.status || 'reported';
      const line = cleanReport(e.sentence || e.excerpt || '');

      // What actually promoted this event, and by whom. With adversarial
      // corroboration the source is the substance of the claim: "a Ukrainian
      // channel said it and Russian state media conceded it" is a far
      // stronger sentence than "corroborated", and the reader should see the
      // opposing outlet by name rather than take our word for the label.
      let why = '';
      const g = (e.statusEvidence || []).slice().reverse()
                  .find(x => x.kind === 'gdelt' && x.reason);
      if (g) {
        const gUrl = /^https?:\/\//i.test(g.url || '') ? escapeHtml(g.url) : '';
        const cite = '<span class="ev-why-src">' + escapeHtml(g.domain || '')
                   + (g.side ? ' <span class="ev-why-side">'
                               + escapeHtml(g.side.replace('_', '-')) + '</span>' : '')
                   + '</span>'
                   + '<span class="ev-why-title">' + escapeHtml(g.title || '') + '</span>';
        why = '<span class="ev-why">'
            + '<span class="ev-why-reason">' + escapeHtml(g.reason) + '</span>'
            + (gUrl ? '<a class="ev-why-link" href="' + gUrl
                      + '" target="_blank" rel="noopener">' + cite + '</a>'
                    : cite)
            + '</span>';
      }

      // The source, small and underneath, and the only clickable thing in
      // the row. It carries the channel and the standing of the claim, so
      // the sentence above it does not have to wear quote marks to say who
      // is speaking.
      const src = escapeHtml(e.channel) + ' \u00b7 '
                + (status === 'reported' ? 'unverified' : escapeHtml(status));
      const srcHtml = safeUrl
        ? '<a class="ev-src" href="' + safeUrl + '" target="_blank" rel="noopener">' + src + '</a>'
        : '<span class="ev-src">' + src + '</span>';

      return '<div class="ev-item">'
        + '<span class="ev-time">' + escapeHtml(String(e.at).slice(11, 16)) + '</span>'
        + '<span class="ev-body">'
        + '<span class="ev-report">' + place + escapeHtml(line) + '</span>'
        + factChips(p)
        + why
        + srcHtml
        + '</span></div>';
    }

    function cap(s) {
      return String(s).charAt(0).toUpperCase() + String(s).slice(1);
    }

    function formatDay(iso) {
      const months = ['January', 'February', 'March', 'April', 'May', 'June',
        'July', 'August', 'September', 'October', 'November', 'December'];
      const p = String(iso).split('-');
      return String(Number(p[2])) + ' ' + months[Number(p[1]) - 1] + ' ' + p[0];
    }

    function showSources(d) {
      const box = document.getElementById('panel-sources');
      const list = d.sources || [];

      if (list.length === 0) {
        box.innerHTML = '';
        return;
      }

      box.innerHTML = '<div class="news-heading">Sources</div>'
        + list.map(s =>
            '<a class="source-item" href="' + s.url + '" target="_blank" rel="noopener">'
          + s.label
          + '</a>'
          ).join('');
    }

    function formatDate(s) {
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      return s.slice(6, 8) + ' ' + months[parseInt(s.slice(4, 6), 10) - 1];
    }

    // ---------------------------------------------------------------
    // PART 4: keep the globe filling the window when it is resized.
    // ---------------------------------------------------------------
    window.addEventListener('resize', () => {
      globe.width(window.innerWidth);
      globe.height(window.innerHeight);
    });
  </script>

</body>

</html>
