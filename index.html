<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Conflict Globe</title>
  <link rel="icon" href="data:,">

  <style>
    body {
      margin: 0;
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    }

    /* ---- The side panel ------------------------------------------
       It is always on the page. We just slide it off-screen to the
       left until a marker is clicked. That is what translateX does.
    ---------------------------------------------------------------- */
    #panel {
      position: fixed;
      top: 0;
      left: 0;
      width: 380px;
      height: 100%;
      box-sizing: border-box;
      padding: 40px 32px;
      background: rgba(10, 12, 16, 0.92);
      backdrop-filter: blur(12px);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      color: #e8eaed;
      transform: translateX(-100%);
      transition: transform 0.35s ease;
      overflow-y: auto;
    }

    /* When the panel also has the class "open", slide it into view. */
    #panel.open {
      transform: translateX(0);
    }

    #panel-close {
      position: absolute;
      top: 20px;
      right: 24px;
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.4);
      font-size: 26px;
      line-height: 1;
      cursor: pointer;
      padding: 4px;
    } 

    #panel-close:hover {
      color: #fff;
    }

    #panel-title {
      margin: 0 0 10px;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    #panel-meta {
      margin: 0 0 24px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #ff5a4d;
    }

    #panel-summary {
      margin: 0;
      font-size: 15px;
      line-height: 1.65;
      color: rgba(232, 234, 237, 0.78);
    }

    /* ---- The recent coverage list ---------------------------------- */
    .news-heading {
      margin: 32px 0 14px;
      padding-top: 22px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: rgba(255, 255, 255, 0.45);
    }

    .news-status {
      margin: 32px 0 0;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.35);
    }

    .news-item {
      display: block;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      text-decoration: none;
      color: inherit;
    }

    .news-item:hover .news-title {
      color: #ff8177;
    }

    .news-title {
      display: block;
      font-size: 14px;
      line-height: 1.45;
      color: rgba(232, 234, 237, 0.9);
    }

    .news-source {
      display: block;
      margin-top: 5px;
      font-size: 11px;
      letter-spacing: 0.04em;
      color: rgba(255, 255, 255, 0.35);
    }

    /* ---- Sources for the written summary --------------------------- */
    .source-item {
      display: block;
      padding: 7px 0;
      font-size: 13px;
      line-height: 1.4;
      color: rgba(232, 234, 237, 0.62);
      text-decoration: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .source-item:hover {
      color: #ff8177;
    }
  </style>
</head>

<body>

  <!-- The globe gets drawn inside this box. -->
  <div id="globeViz"></div>

  <!-- The side panel. Empty to start with. JavaScript fills it in. -->
  <div id="panel">
    <button id="panel-close">&times;</button>
    <h1 id="panel-title"></h1>
    <p id="panel-meta"></p>
    <p id="panel-summary"></p>
    <div id="panel-sources"></div>
    <div id="panel-news"></div>
  </div>

  <!-- Downloads the globe.gl library and gives us the Globe() function. -->
  <script src="https://cdn.jsdelivr.net/npm/globe.gl@2.46.2/dist/globe.gl.min.js"></script>

  <!-- Decodes TopoJSON, the compact format the country border data ships in. -->
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>

  <script>
    // ---------------------------------------------------------------
    // PART 1: build the globe itself.
    // ---------------------------------------------------------------
    const globe = Globe()(document.getElementById('globeViz'))
      .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-dark.jpg')
      .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
      .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
      .atmosphereColor('#3a7bd5')
      .atmosphereAltitude(0.18);

    // ---------------------------------------------------------------
    // PART 2: camera and motion.
    // ---------------------------------------------------------------
    globe.controls().autoRotate = true;
    globe.controls().autoRotateSpeed = 0.4;
    globe.pointOfView({ lat: 25, lng: 20, altitude: 2.5 });

    // How far the camera currently is from the surface. Marker sizes are
    // scaled by this so they keep a constant size on screen as you zoom.
    let cameraAltitude = 2.5;

    // Clamped so markers neither vanish up close nor swell when far out.
    function zoomScale() {
      return Math.max(0.03, Math.min(cameraAltitude, 3));
    }

    const markerRadius = d => (0.33 + d.intensity * 0.12) * zoomScale();
    const ringRadius   = d => (1.1 + d.intensity * 1.4) * zoomScale();

    // ---------------------------------------------------------------
    // PART 2b: country borders.
    //
    // These are drawn as vector geometry, not painted into the globe
    // texture. Vectors have no resolution, so the borders stay sharp
    // however far you zoom, which a 4096px image never can.
    //
    // The file is TopoJSON, a compact format that stores shared borders
    // once instead of twice. topojson.feature() expands it into ordinary
    // GeoJSON that globe.gl understands.
    // ---------------------------------------------------------------
    fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json')
      .then(r => r.json())
      .then(topo => {
        const geo = topojson.feature(topo, topo.objects.countries);
        globe
          .polygonsData(geo.features)
          .polygonCapColor(() => 'rgba(0,0,0,0)')   // no fill on top
          .polygonSideColor(() => 'rgba(0,0,0,0)')  // no extruded walls
          .polygonStrokeColor(() => 'rgba(130,175,220,0.6)')
          .polygonAltitude(0.002);
      })
      .catch(() => {
        // Borders are decoration. If the CDN is unreachable the globe
        // should still work rather than the whole page dying.
        console.warn('Country borders failed to load.');
      });

    // ---------------------------------------------------------------
    // PART 3: fetch the data, then draw the markers.
    // ---------------------------------------------------------------
    fetch('conflicts.json')
      .then(response => response.json())
      .then(conflicts => {
        globe
          .pointsData(conflicts)
          .pointLat(d => d.lat)
          .pointLng(d => d.lng)
          .pointAltitude(0.004)
          .pointRadius(markerRadius)
          .pointColor(() => '#ff2a1f')
          .pointLabel(d => d.name)
                    .onPointClick(d => showPanel(d))
          .ringsData(conflicts)
          .ringLat(d => d.lat)
          .ringLng(d => d.lng)
          .ringMaxRadius(ringRadius)
          .ringPropagationSpeed(1.2)
          .ringRepeatPeriod(1400)
          .ringColor(() => t => `rgba(255,60,48,${1 - t})`);

        // Fires whenever the camera moves. Store the new altitude and hand
        // the size functions back to globe.gl so it redraws at the new scale.
        globe.onZoom(pov => {
          // Relative, not absolute. A 0.01 change is nothing at altitude 2.5
          // but a tenth of the way at altitude 0.1, which made the markers
          // jump in visible steps when zoomed in close.
          if (Math.abs(pov.altitude - cameraAltitude) / cameraAltitude < 0.004) return;
          cameraAltitude = pov.altitude;
          // Wrapped in fresh arrow functions on purpose. globe.gl only
          // redraws when a setting actually changes, and it compares
          // functions by identity. Handing back the same function object
          // looks like "nothing changed" and the markers never resize.
          globe.pointRadius(d => markerRadius(d)).ringMaxRadius(d => ringRadius(d));
        });
      });

    // ---------------------------------------------------------------
    // PART 5: the panel.
    // YOUR CODE GOES HERE. See the instructions in chat.
    // ---------------------------------------------------------------
    const panel = document.getElementById('panel');

    function showPanel(d) {
      document.getElementById('panel-title').textContent = d.name;
      document.getElementById('panel-meta').textContent = d.type + ' · updated ' + d.updated;
      document.getElementById('panel-summary').textContent = d.summary;

      panel.classList.add('open');

      globe.controls().autoRotate = false;
      globe.pointOfView({ lat: d.lat, lng: d.lng, altitude: 1.6 }, 1000);

      showSources(d);
      loadNews(d);
    }

    document.getElementById('panel-close').addEventListener('click', () => {
      panel.classList.remove('open');
      globe.controls().autoRotate = true;
    });

    // ---------------------------------------------------------------
    // PART 6: live news from GDELT.
    // YOUR CODE GOES HERE. See the instructions in chat.
    // ---------------------------------------------------------------
    // Words that suggest an article is about the conflict rather than
    // about politics, markets or sport happening near the same place.
    const CONFLICT_WORDS = [
      'strike', 'drone', 'missile', 'attack', 'shell', 'offensive', 'fighting',
      'clash', 'killed', 'wounded', 'casualt', 'troops', 'forces', 'siege',
      'bomb', 'ceasefire', 'front line', 'frontline', 'assault', 'raid',
      'gunmen', 'militia', 'rebels', 'evacuat', 'displaced'
    ];

    // Results are cached per conflict so clicking the same marker twice
    // does not mean waiting on GDELT twice.
    const newsCache = {};

    // Anything from GDELT is untrusted text. Escape it before it goes
    // anywhere near innerHTML.
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // Strip punctuation and case so syndicated copies of the same story
    // collapse to one entry.
    function titleKey(s) {
      return String(s).toLowerCase().replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ').trim().slice(0, 55);
    }

    // Rank rather than filter. Filtering on one rule threw everything away.
    function scoreArticle(a, d) {
      const title = (a.title || '').toLowerCase();
      let score = 0;
      if ((d.match || []).some(m => title.includes(m.toLowerCase()))) score += 3;
      if (CONFLICT_WORDS.some(w => title.includes(w))) score += 1;
      if (a.language === 'English') score += 2;
      return score;
    }

    function loadNews(d) {
      const news = document.getElementById('panel-news');

      if (newsCache[d.name]) {
        renderNews(newsCache[d.name].articles, newsCache[d.name].weak);
        return;
      }

      news.innerHTML = '<p class="news-status">Loading recent coverage. GDELT can take up to 20 seconds.</p>';

      const url = 'https://api.gdeltproject.org/api/v2/doc/doc'
        + '?query=' + encodeURIComponent(d.query)
        + '&mode=artlist&format=json&maxrecords=75&sort=hybridrel&timespan=7d';

      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 22000);

      fetch(url, { signal: controller.signal })
        .then(r => r.text())
        .then(text => {
          clearTimeout(timer);

          let data;
          try {
            data = JSON.parse(text);
          } catch (e) {
            news.innerHTML = '<p class="news-status">GDELT rejected the query: '
              + escapeHtml(text.slice(0, 200)) + '</p>';
            return;
          }

          const seen = new Set();
          const ranked = (data.articles || [])
            .filter(a => a.title && a.url)
            .map(a => Object.assign({}, a, { score: scoreArticle(a, d) }))
            .filter(a => {
              const k = titleKey(a.title);
              if (seen.has(k)) return false;
              seen.add(k);
              return true;
            })
            .sort((x, y) => (y.score - x.score) || String(y.seendate).localeCompare(String(x.seendate)));

          const strong = ranked.filter(a => a.score >= 3);
          // Never show an empty panel when there was something to show.
          const weak = strong.length === 0 && ranked.length > 0;
          const articles = (weak ? ranked : strong).slice(0, 10);

          newsCache[d.name] = { articles: articles, weak: weak };
          renderNews(articles, weak);
        })
        .catch(err => {
          clearTimeout(timer);
          news.innerHTML = '<p class="news-status">'
            + (err.name === 'AbortError'
                ? 'GDELT did not respond in time. Try again in a moment.'
                : 'Could not load coverage.')
            + '</p>';
        });
    }

    function renderNews(articles, weak) {
      const news = document.getElementById('panel-news');

      if (!articles || articles.length === 0) {
        news.innerHTML = '<p class="news-status">No coverage found in the last 7 days.</p>';
        return;
      }

      const heading = weak
        ? '<div class="news-heading">Recent coverage &middot; loosely matched</div>'
        : '<div class="news-heading">Recent coverage</div>';

      news.innerHTML = heading + articles.map(a => {
        const safeUrl = /^https?:\/\//i.test(a.url) ? escapeHtml(a.url) : '#';
        const lang = a.language && a.language !== 'English' ? ' &middot; ' + escapeHtml(a.language) : '';
        return '<a class="news-item" href="' + safeUrl + '" target="_blank" rel="noopener">'
          + '<span class="news-title">' + escapeHtml(a.title) + '</span>'
          + '<span class="news-source">' + escapeHtml(a.domain) + ' &middot; '
          + formatDate(a.seendate) + lang + '</span>'
          + '</a>';
      }).join('');
    }

    function showSources(d) {
      const box = document.getElementById('panel-sources');
      const list = d.sources || [];

      if (list.length === 0) {
        box.innerHTML = '';
        return;
      }

      box.innerHTML = '<div class="news-heading">Sources</div>'
        + list.map(s =>
            '<a class="source-item" href="' + s.url + '" target="_blank" rel="noopener">'
          + s.label
          + '</a>'
          ).join('');
    }

    function formatDate(s) {
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      return s.slice(6, 8) + ' ' + months[parseInt(s.slice(4, 6), 10) - 1];
    }

    // ---------------------------------------------------------------
    // PART 4: keep the globe filling the window when it is resized.
    // ---------------------------------------------------------------
    window.addEventListener('resize', () => {
      globe.width(window.innerWidth);
      globe.height(window.innerHeight);
    });
  </script>

</body>

</html>
